<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ad 4 — The Kid Sibling</title>
<link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f0f7ff;
  }

  .ad {
    position: relative;
    display: flex;
    flex-direction: column;
    background: #f0f7ff;
    overflow: hidden;
  }

  /* ---- Ratio: 1:1 (1080x1080) ---- */
  .ad[data-ratio="1x1"] { width: 1080px; height: 1080px; }
  .ad[data-ratio="1x1"] .top-bar { padding: 44px 48px 0; }
  .ad[data-ratio="1x1"] .persona-tag { font-size: 28px; padding: 12px 26px; }
  .ad[data-ratio="1x1"] .brand { font-size: 22px; }
  .ad[data-ratio="1x1"] .headline { padding: 30px 48px 22px; }
  .ad[data-ratio="1x1"] .headline h1 { font-size: 64px; }
  .ad[data-ratio="1x1"] .sub-headline { display: none; }
  .ad[data-ratio="1x1"] .product-grid { height: 55%; padding: 0 48px; }
  .ad[data-ratio="1x1"] .product-label { font-size: 22px; padding: 6px 14px; }
  .ad[data-ratio="1x1"] .product-price { font-size: 24px; padding: 6px 14px; }
  .ad[data-ratio="1x1"] .bottom-bar { padding: 24px 48px 48px; }
  .ad[data-ratio="1x1"] .offer-pill { font-size: 22px; padding: 10px 20px; }
  .ad[data-ratio="1x1"] .cta { font-size: 26px; padding: 14px 32px; }

  /* ---- Ratio: 4:5 (1080x1350) ---- */
  .ad[data-ratio="4x5"] { width: 1080px; height: 1350px; }
  .ad[data-ratio="4x5"] .top-bar { padding: 46px 48px 0; }
  .ad[data-ratio="4x5"] .persona-tag { font-size: 30px; padding: 13px 28px; }
  .ad[data-ratio="4x5"] .brand { font-size: 24px; }
  .ad[data-ratio="4x5"] .headline { padding: 32px 48px 24px; }
  .ad[data-ratio="4x5"] .headline h1 { font-size: 70px; }
  .ad[data-ratio="4x5"] .sub-headline { display: none; }
  .ad[data-ratio="4x5"] .product-grid { flex: 1; padding: 0 48px; }
  .ad[data-ratio="4x5"] .product-label { font-size: 24px; padding: 7px 15px; }
  .ad[data-ratio="4x5"] .product-price { font-size: 26px; padding: 7px 15px; }
  .ad[data-ratio="4x5"] .bottom-bar { padding: 26px 48px 56px; flex-wrap: wrap; row-gap: 20px; }
  .ad[data-ratio="4x5"] .offers { flex-wrap: wrap; }
  .ad[data-ratio="4x5"] .offer-pill { font-size: 24px; padding: 11px 22px; }
  .ad[data-ratio="4x5"] .cta { font-size: 28px; padding: 15px 34px; }

  /* ---- Ratio: 9:16 (1080x1920) ---- */
  .ad[data-ratio="9x16"] { width: 1080px; height: 1920px; }
  .ad[data-ratio="9x16"] .top-bar { padding: 48px 48px 0; }
  .ad[data-ratio="9x16"] .persona-tag { font-size: 34px; padding: 14px 30px; }
  .ad[data-ratio="9x16"] .brand { font-size: 26px; }
  .ad[data-ratio="9x16"] .headline { padding: 36px 48px 8px; }
  .ad[data-ratio="9x16"] .headline h1 { font-size: 80px; }
  .ad[data-ratio="9x16"] .sub-headline { display: block; padding: 0 48px 32px; }
  .ad[data-ratio="9x16"] .sub-headline p { font-size: 36px; }
  .ad[data-ratio="9x16"] .product-grid { flex: 1; padding: 0 48px; }
  .ad[data-ratio="9x16"] .product-label { font-size: 26px; padding: 8px 16px; }
  .ad[data-ratio="9x16"] .product-price { font-size: 28px; padding: 8px 16px; }
  .ad[data-ratio="9x16"] .bottom-bar { padding: 28px 48px 60px; flex-wrap: wrap; row-gap: 20px; }
  .ad[data-ratio="9x16"] .offers { flex-wrap: wrap; }
  .ad[data-ratio="9x16"] .offer-pill { font-size: 26px; padding: 12px 24px; }
  .ad[data-ratio="9x16"] .cta { font-size: 30px; padding: 16px 36px; }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .persona-tag {
    background: #4a90e2;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 0.04em;
    border-radius: 40px;
    text-transform: uppercase;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.85;
  }

  .brand-logo {
    height: 2.2em;
    width: auto;
    flex-shrink: 0;
  }

  .brand-name {
    font-family: 'Science Gothic', sans-serif;
    color: #666;
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  /* Headline */
  .headline { flex-shrink: 0; }

  .headline h1 {
    color: #1a1a1a;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.02em;
  }

  .headline h1 span { color: #4a90e2; }

  /* Sub-headline (9:16 only) */
  .sub-headline { display: none; flex-shrink: 0; }
  .sub-headline p {
    color: #666;
    font-weight: 600;
  }

  /* Product grid */
  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    min-height: 0;
  }

  .product-cell {
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(74,144,226,0.1);
  }

  .product-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Per-image crop anchors: near-square cells (1:1, 4:5) vs. tall cells (9:16) */
  .ad[data-ratio="1x1"] .img-trex,
  .ad[data-ratio="4x5"] .img-trex { object-position: 45% 40%; }
  .ad[data-ratio="9x16"] .img-trex { object-position: 45% 35%; }

  .ad[data-ratio="1x1"] .img-spider,
  .ad[data-ratio="4x5"] .img-spider { object-position: center 55%; }
  .ad[data-ratio="9x16"] .img-spider { object-position: center 50%; }

  .ad[data-ratio="1x1"] .img-ocarina,
  .ad[data-ratio="4x5"] .img-ocarina { object-position: 55% center; }
  .ad[data-ratio="9x16"] .img-ocarina { object-position: 55% 45%; }

  .ad[data-ratio="1x1"] .img-penguin,
  .ad[data-ratio="4x5"] .img-penguin { object-position: center 45%; }
  .ad[data-ratio="9x16"] .img-penguin { object-position: center 40%; }

  .product-label {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(255,255,255,0.92);
    color: #222;
    font-weight: 600;
    border-radius: 8px;
  }

  .product-price {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: #4a90e2;
    color: #ffffff;
    font-weight: 800;
    border-radius: 8px;
  }

  /* Bottom bar */
  .bottom-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 20px;
    border-top: 1px solid rgba(74,144,226,0.15);
    margin-top: 14px;
    padding-top: 24px;
  }

  .offers {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .offer-pill {
    background: #ffffff;
    color: #555;
    font-weight: 600;
    border-radius: 40px;
    border: 1px solid #d0e4f7;
    white-space: nowrap;
  }

  .offer-pill.highlight {
    background: #e8f2fd;
    border-color: #4a90e2;
    color: #2a6ab8;
  }

  .cta {
    background: #4a90e2;
    color: #ffffff;
    font-weight: 800;
    border-radius: 40px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="ad" data-ratio="1x1" id="ad">
  <div class="top-bar">
    <div class="persona-tag">🦕 The Kid Sibling</div>
    <div class="brand">
      <img class="brand-logo" src="../../../images/layerweaver-logo.svg" alt="">
      <span class="brand-name">LayerWeaver.com</span>
    </div>
  </div>

  <div class="headline">
    <h1>They've seen everything.<br><span>Not these.</span></h1>
  </div>

  <div class="sub-headline">
    <p>3D printed toys and games they've never seen before.</p>
  </div>

  <div class="product-grid">
    <div class="product-cell">
      <img class="img-trex" src="https://cdn.shopify.com/s/files/1/0784/9404/0286/files/bone_white_t_rex.png" alt="T-Rex Skeleton">
      <div class="product-label">T-Rex Skeleton</div>
      <div class="product-price">₹249</div>
    </div>
    <div class="product-cell">
      <img class="img-spider" src="https://cdn.shopify.com/s/files/1/0784/9404/0286/files/articulated-cute-spider-1.png" alt="Articulated Cute Spider">
      <div class="product-label">Articulated Spider</div>
      <div class="product-price">₹249</div>
    </div>
    <div class="product-cell">
      <img class="img-ocarina" src="https://cdn.shopify.com/s/files/1/0784/9404/0286/files/bird-ocarina-5.png" alt="Bird Ocarina">
      <div class="product-label">Bird Ocarina</div>
      <div class="product-price">₹199</div>
    </div>
    <div class="product-cell">
      <img class="img-penguin" src="https://cdn.shopify.com/s/files/1/0784/9404/0286/files/product_Jul_18_2026_07_11_05_PM.png" alt="Cute Wobble Penguin Desk Toy">
      <div class="product-label">Wobble Penguin</div>
      <div class="product-price">₹399</div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="offers">
      <div class="offer-pill highlight">Free bunny keychain above ₹499</div>
      <div class="offer-pill">Free shipping above ₹299</div>
      <div class="offer-pill">3D printed in Pune</div>
    </div>
    <div class="cta">Shop now →</div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const ratio = params.get('ratio');
  if (ratio) document.getElementById('ad').setAttribute('data-ratio', ratio);
</script>
</body>
</html>
